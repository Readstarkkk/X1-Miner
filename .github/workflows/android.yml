

name: Build X1 Miner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config make curl git xz-utils

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check source layout
        run: |
          test -f app/src/main/AndroidManifest.xml
          find app/src/main/java -type f -name '*.java'
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' app

      - name: Fetch pinned ARM64 XMRig runtime
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-all-errors "https://raw.githubusercontent.com/XMRig-for-Android/xmrig-for-android/9e227e960863057b230b9d6c5c517e4d4b934fba/android/app/src/main/jniLibs/arm64-v8a/libxmrig.so" -o app/src/main/jniLibs/arm64-v8a/libxmrig.so
          test "$(git hash-object app/src/main/jniLibs/arm64-v8a/libxmrig.so)" = "808c0a69c27b70620f47adc76a573e539715211d"
          chmod 755 app/src/main/jniLibs/arm64-v8a/libxmrig.so

      - name: Build experimental Scrypt runtime for Android ARM64
        run: bash scripts/build-scrypt-android.sh

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X1-Miner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
