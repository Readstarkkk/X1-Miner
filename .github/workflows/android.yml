name: Build X1 Monitor APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Explicitly override android-actions/setup-android's legacy default
      # package list (which includes the removed SDK package named "tools").
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check source layout
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/x1miner/app/MainActivity.java
          test -f app/src/main/java/com/x1miner/app/ThermalGuardService.java
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' app .github

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X1-Monitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
