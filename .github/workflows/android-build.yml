name: Build X1 Miner Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform, build tools and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config make curl git xz-utils

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Fetch pinned ARM64 XMRig runtime
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-all-errors "https://raw.githubusercontent.com/XMRig-for-Android/xmrig-for-android/9e227e960863057b230b9d6c5c517e4d4b934fba/android/app/src/main/jniLibs/arm64-v8a/libxmrig.so" -o app/src/main/jniLibs/arm64-v8a/libxmrig.so
          test "$(git hash-object app/src/main/jniLibs/arm64-v8a/libxmrig.so)" = "808c0a69c27b70620f47adc76a573e539715211d"
          chmod 755 app/src/main/jniLibs/arm64-v8a/libxmrig.so

      - name: Build experimental Scrypt/Skein runtime for Android ARM64
        run: bash scripts/build-scrypt-android.sh

      - name: Run offline SHA-256d unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: X1-Miner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
