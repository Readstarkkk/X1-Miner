plugins {
    id 'com.android.application'
}

android {
    namespace 'com.x1miner.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.x1miner.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-preview'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
